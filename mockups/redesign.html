<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Situation Room redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="redesign-geo.js"></script>
<style>
:root{
  --bg:#1b1918; --panel:#211e1c; --panel2:#282421; --line:#35302c; --line2:#4a433d;
  --text:#efe6dd; --head:#fff8f1; --muted:#a99d93; --faint:#766b62;
  --accent:#f4a58a; --accent2:#e2694f; --teal:#3fb0b3; --gold:#e3b64d; --blue:#5fa8dc;
  --houthi:#c45c26; --gov:#3fb0b3; --contested:#e3b64d;
  --iran:#e2694f; --israel:#5fa8dc; --gulf:#9b7fd1; --hez:#d9aa45; --iraq:#c9895a;
  --serif:Newsreader,Georgia,serif; --sans:"Libre Franklin",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}

/* mock bar (not part of the design) */
.mockbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:#0f0e0d;border-bottom:1px dashed var(--line2);font-size:12px;color:var(--muted)}
.mockbar b{color:var(--gold);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.seg button{padding:4px 12px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#1b1918;font-weight:600}

/* masthead */
.mast{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 20px 10px;border-bottom:1px solid var(--line)}
.mast .sr{width:30px;height:30px;border:1.5px solid var(--accent);border-radius:6px;display:grid;place-items:center;font-family:var(--serif);font-weight:600;color:var(--accent);font-size:13px}
.mast h1{margin:0;font-family:var(--serif);font-weight:600;font-size:34px;color:var(--head);text-align:center;letter-spacing:-.01em;cursor:pointer}
.mast .tag{display:block;text-align:center;font-size:10.5px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase;margin-top:2px}
.mast .clock{justify-self:end;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.mast .clock b{color:var(--head);font-weight:600}

/* desk strip = RTS "control groups" */
.strip{display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.deskbtn{display:flex;align-items:center;gap:10px;padding:10px 18px;border-right:1px solid var(--line);white-space:nowrap;position:relative;color:var(--muted);transition:background .2s}
.deskbtn:hover{background:var(--panel)}
.deskbtn.on{color:var(--head);background:var(--panel)}
.deskbtn.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
.deskbtn .k{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-radius:3px;padding:0 4px;color:var(--faint)}
.deskbtn .nm{font-weight:600;font-size:13px;letter-spacing:.02em}
.deskbtn .pulse{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 0 rgba(226,105,79,.6);animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 7px rgba(226,105,79,0)}100%{box-shadow:0 0 0 0 rgba(226,105,79,0)}}
.trend{font-size:12px}
.trend.up{color:var(--accent2)} .trend.flat{color:var(--muted)} .trend.down{color:var(--teal)}
.deskbtn.ghost{color:var(--faint);font-style:italic}
.flag{width:22px;height:14px;border-radius:2px;flex:none;overflow:hidden;display:grid}
.flag.ye{grid-template-rows:1fr 1fr 1fr}.flag.ye i:nth-child(1){background:#ce1126}.flag.ye i:nth-child(2){background:#fff}.flag.ye i:nth-child(3){background:#000}
.flag.ir{grid-template-rows:1fr 1fr 1fr}.flag.ir i:nth-child(1){background:#239f40}.flag.ir i:nth-child(2){background:#fff}.flag.ir i:nth-child(3){background:#da0000}
.flag.all{background:conic-gradient(var(--accent) 0 25%,var(--teal) 0 50%,var(--gold) 0 75%,var(--blue) 0);border-radius:50%;width:14px;height:14px}

/* desk headline row */
.headrow{padding:14px 20px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.kicker{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.kicker b{color:var(--accent)}
.deskh{font-family:var(--serif);font-size:30px;font-weight:500;color:var(--head);margin:2px 0 0;line-height:1.1;transition:opacity .25s}
.deskh .sw{font-size:16px;color:var(--accent);margin-left:6px}
.oneline{font-family:var(--serif);font-size:17px;color:var(--text);margin:6px 0 0;max-width:900px;line-height:1.35}
.oneline sup{color:var(--accent);font-size:10px}
.shares{display:flex;gap:8px}
.share{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;min-width:96px}
.share small{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.share b{font-family:var(--serif);font-size:20px;font-weight:500}

/* map stage */
.stage{position:relative;height:min(68vh,640px);min-height:440px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#141211}
#map{position:absolute;inset:0;background:#141211}
.leaflet-container{font-family:var(--sans)}
.leaflet-control-attribution{background:rgba(27,25,24,.7)!important;color:var(--faint)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.hud{position:absolute;z-index:500;pointer-events:none}
.hud>*{pointer-events:auto}
.glass{background:rgba(27,25,24,.86);backdrop-filter:blur(6px);border:1px solid var(--line2);border-radius:8px}

/* resource bar (Age of Empires) */
.res{top:10px;left:50%;transform:translateX(-50%);display:flex;gap:0;padding:0}
.res div{padding:6px 14px;border-right:1px solid var(--line);text-align:center}
.res div:last-child{border:0}
.res small{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.res b{font-family:var(--mono);font-size:15px;color:var(--head);font-weight:600}
.res i{font-style:normal;font-size:10px;margin-left:4px;color:var(--accent2)}

/* lenses (Civ VI / HOI4 map modes) */
.lenses{top:10px;left:10px;display:flex;flex-direction:column;padding:4px;gap:2px}
.lenses button{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:5px;font-size:12px;color:var(--muted);text-align:left}
.lenses button .k{font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--line2);border-radius:3px;padding:0 4px}
.lenses button.on{background:var(--panel2);color:var(--head)}
.lenses button.on .k{color:var(--accent);border-color:var(--accent)}

/* alert jump (StarCraft space) */
.alerts{top:10px;right:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.jump{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--head)}
.jump .k{font-family:var(--mono);font-size:10px;border:1px solid var(--accent);color:var(--accent);border-radius:3px;padding:0 5px}
.since{font-size:11.5px;padding:6px 10px;color:var(--text)}
.since b{color:var(--gold)}
.chips{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.chip{font-size:11px;padding:4px 9px;border-radius:999px;background:rgba(226,105,79,.16);border:1px solid rgba(226,105,79,.5);color:var(--accent);animation:in .4s}
@keyframes in{from{opacity:0;transform:translateX(10px)}}

/* minimap */
.mini{bottom:58px;left:10px;width:170px;height:120px;overflow:hidden;padding:0}
.mini canvas{display:block;width:100%;height:100%}
.mini .lbl{position:absolute;top:4px;left:7px;font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}

/* selection card (command card) */
.sel{bottom:58px;right:10px;width:320px;padding:12px 14px;display:none}
.sel.show{display:block;animation:in .25s}
.sel .meta{font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center}
.sel .meta .ty{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--panel2);color:var(--accent)}
.sel h4{font-family:var(--serif);font-weight:500;font-size:17px;margin:6px 0 8px;color:var(--head);line-height:1.25}
.mix{display:flex;height:5px;border-radius:3px;overflow:hidden;margin:4px 0 2px}
.mixl{font-size:10px;color:var(--faint);display:flex;justify-content:space-between}
.sel .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sel .acts button{font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:3px 9px;color:var(--muted)}
.sel .acts button:hover{color:var(--head);border-color:var(--accent)}
.sel .x{position:absolute;top:6px;right:8px;color:var(--faint)}

/* scrubber (replays / Windy) */
.scrub{left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:10px;padding:6px 10px}
.scrub .play{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#1b1918;display:grid;place-items:center;font-size:11px;flex:none}
.scrub .sp{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:2px 6px;flex:none}
.track{position:relative;flex:1;height:28px}
.track canvas{position:absolute;inset:0;width:100%;height:100%}
.track input{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer;margin:0}
.thumb{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none}
.thumb span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;background:var(--accent);color:#1b1918;padding:1px 5px;border-radius:3px;white-space:nowrap;margin-bottom:3px}
.scrub .when{font-family:var(--mono);font-size:11px;color:var(--head);flex:none;min-width:86px;text-align:right}

/* home: desk plates on the map */
.plate{background:rgba(27,25,24,.92);border:1px solid var(--line2);border-radius:8px;padding:9px 12px 10px;width:230px;color:var(--text);cursor:pointer;transition:border-color .2s,transform .2s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.plate:hover{border-color:var(--accent);transform:translateY(-2px)}
.plate .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;letter-spacing:.04em;color:var(--head);text-transform:uppercase}
.plate .t .trend{margin-left:auto;font-weight:600;font-size:11px;letter-spacing:0;text-transform:none}
.plate p{font-family:var(--serif);font-size:14px;line-height:1.3;margin:6px 0 6px;color:var(--text)}
.plate .go{font-size:10.5px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.plate .spark{display:block;margin-top:6px}
.leaflet-div-icon.plain{background:none;border:0}

/* theatre label (Supreme Commander strategic icon) */
.theatre{font-family:var(--serif);font-size:13px;color:var(--head);letter-spacing:.2em;text-transform:uppercase;text-shadow:0 1px 6px #000;white-space:nowrap;pointer-events:none;opacity:.85}

/* below the map */
.below{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;border-bottom:1px solid var(--line)}
.col{padding:16px 20px}
.col+.col{border-left:1px solid var(--line)}
.sech{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sech h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0;color:var(--head)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font-size:11.5px;padding:3px 10px;border:1px solid var(--line2);border-radius:999px;color:var(--muted)}
.filters button.on{border-color:var(--accent);color:var(--head)}
.card{display:grid;grid-template-columns:4px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.card:hover h3{color:var(--accent)}
.card .edge{border-radius:2px}
.card .m{font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .m .src{color:var(--accent)}
.card .m .dk{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid var(--line2)}
.card h3{font-family:var(--serif);font-weight:500;font-size:16.5px;margin:3px 0 0;line-height:1.3;color:var(--head);transition:color .15s}
.card .pin{font-size:10.5px;color:var(--faint);margin-top:3px}
.card.new h3::before{content:"NEW ";font-family:var(--sans);font-size:9.5px;letter-spacing:.1em;color:var(--gold);font-weight:700;vertical-align:2px}
.devs ol{margin:0;padding-left:18px;font-family:var(--serif);font-size:16px;line-height:1.4}
.devs li{margin-bottom:10px}
.devs li sup{color:var(--accent);font-size:10px;font-family:var(--sans)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.num{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel)}
.num small{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num b{display:block;font-family:var(--serif);font-weight:500;font-size:22px;color:var(--head)}
.num svg{display:block;margin-top:4px}
.deskrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.dcard{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel);cursor:pointer;transition:border-color .2s}
.dcard:hover{border-color:var(--accent)}
.dcard .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--head)}
.dcard p{font-family:var(--serif);font-size:15px;margin:8px 0 0;line-height:1.3}
.dcard.ghost{border-style:dashed;color:var(--faint);background:none}
.about{font-family:var(--serif);font-size:15px;color:var(--muted);line-height:1.5;max-width:720px}

/* Command layout: full-bleed map with rail */
body.cmd .stage{height:calc(100vh - 160px);min-height:520px}
body.cmd .below{display:none}
body.cmd .rail{display:flex}
.rail{display:none;position:absolute;z-index:600;top:0;right:0;bottom:0;width:360px;flex-direction:column;background:rgba(27,25,24,.94);border-left:1px solid var(--line2)}
.rail .tabs{display:flex;border-bottom:1px solid var(--line)}
.rail .tabs button{flex:1;padding:9px 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rail .tabs button.on{color:var(--head);box-shadow:inset 0 -2px var(--accent)}
.rail .body{overflow:auto;padding:4px 14px;flex:1;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.rail .log{font-family:var(--mono);font-size:11.5px;line-height:1.55}
.rail .log div{padding:3px 0;border-bottom:1px dotted var(--line);cursor:pointer}
.rail .log div:hover{color:var(--accent)}
.rail .log span{color:var(--faint)}
body.cmd .sel,body.cmd .alerts{right:370px}
body.cmd .scrub{right:370px}
body.cmd .res{left:calc(50% - 180px)}

.deskchips{display:none;left:8px;right:8px;bottom:56px;gap:6px}
.deskchips button{flex:1;display:flex;align-items:center;gap:8px;padding:9px 10px;font-weight:600;font-size:13px;color:var(--head)}
.deskchips .trend{margin-left:auto}
/* fog lens */
.fogtxt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);white-space:nowrap;pointer-events:none}

/* transitions between home and desk */
.fade{transition:opacity .3s}
.fade.out{opacity:0}

@media (max-width:820px){
  .mast{grid-template-columns:auto 1fr;padding:10px 16px}
  .mast h1{font-size:24px;text-align:left;margin-left:10px}
  .mast .tag{text-align:left;margin-left:10px}
  .mast .clock{display:none}
  .headrow{padding:12px 16px}
  .deskh{font-size:24px}
  .shares{width:100%}
  .share{flex:1;min-width:0}
  .stage{height:62vh}
  .res{display:none}
  .lenses{flex-direction:row;left:8px;right:8px;top:8px;overflow-x:auto}
  .lenses button .k{display:none}
  .alerts{top:52px;right:8px}
  .since{display:none}
  .mini{display:none}
  .sel{left:8px;right:8px;width:auto;bottom:56px}
  .below{grid-template-columns:1fr}
  .col{padding:14px 16px}
  .col+.col{border-left:0;border-top:1px solid var(--line)}
  .plate{display:none}
  .leaflet-control-zoom{display:none}
  body.home .deskchips{display:flex}
  body.cmd .rail{top:auto;height:42%;width:auto;left:0;border-left:0;border-top:1px solid var(--line2)}
  body.cmd .sel,body.cmd .alerts,body.cmd .scrub{right:8px}
  body.cmd .scrub{bottom:calc(42% + 8px)}
}
</style>
</head>
<body>

<div class="mockbar">
  <b>Mock</b>
  <span>Layout</span>
  <span class="seg" id="layoutSeg"><button data-l="news" class="on">Newsroom</button><button data-l="cmd">Command</button></span>
  <span>· Click a desk (top strip, map plate, or keys <code>0 1 2</code>) and the map flies to it. Map modes <code>Q W E R</code>, last alert <code>Space</code>.</span>
  <span style="margin-left:auto"><a href="redesign-ideas.html" style="color:var(--accent)">All ideas →</a></span>
</div>

<header class="mast">
  <div class="sr">SR</div>
  <div><h1 id="homeLink">The Situation Room</h1><span class="tag">Open-source intelligence</span></div>
  <div class="clock" id="clock"></div>
</header>

<nav class="strip" id="strip">
  <button class="deskbtn on" data-desk="home"><span class="k">0</span><span class="flag all"></span><span class="nm">All desks</span></button>
  <button class="deskbtn" data-desk="yemen"><span class="k">1</span><span class="flag ye"><i></i><i></i><i></i></span><span class="nm">Yemen conflict</span><span class="pulse"><span class="dot"></span>live</span><span class="trend up" title="More activity than last week">▲ 18%</span></button>
  <button class="deskbtn" data-desk="iran"><span class="k">2</span><span class="flag ir"><i></i><i></i><i></i></span><span class="nm">Iran conflict</span><span class="pulse"><span class="dot"></span>live</span><span class="trend down" title="Less activity than last week">▼ 6%</span></button>
  <button class="deskbtn ghost" disabled><span class="k">3</span><span class="nm">Next desk</span></button>
</nav>

<section class="headrow fade" id="headrow"></section>

<section class="stage">
  <div id="map"></div>

  <div class="hud glass lenses" id="lenses">
    <button data-lens="pins" class="on"><span class="k">Q</span>Reports</button>
    <button data-lens="heat"><span class="k">W</span>Activity heat</button>
    <button data-lens="control"><span class="k">E</span>Control</button>
    <button data-lens="fog"><span class="k">R</span>Quiet areas</button>
  </div>

  <div class="hud glass res" id="res"></div>

  <div class="hud alerts">
    <button class="glass jump" id="jump"><span class="k">Space</span>Latest alert</button>
    <div class="glass since" id="since">Since your last visit (6 h): <b>14 new</b> · 1 control change</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="hud glass mini" id="mini"><canvas id="miniC" width="340" height="240"></canvas><span class="lbl">Theatre</span></div>

  <div class="hud glass sel" id="sel"></div>
  <div class="hud deskchips"><button class="glass" onclick="go('yemen')"><span class="flag ye"><i></i><i></i><i></i></span>Yemen<span class="trend up">▲ 18%</span></button><button class="glass" onclick="go('iran')"><span class="flag ir"><i></i><i></i><i></i></span>Iran<span class="trend down">▼ 6%</span></button></div>

  <div class="hud glass scrub">
    <button class="play" id="play" title="Replay">▶</button>
    <span class="sp" id="speed">1 day/s</span>
    <div class="track"><canvas id="trackC" height="56"></canvas><input type="range" id="range" min="0" max="100" value="100"><div class="thumb" id="thumb"><span id="thumbLbl">Today</span></div></div>
    <span class="when" id="when">Last 7 days</span>
  </div>

  <aside class="rail" id="rail">
    <div class="tabs"><button class="on">Reports</button><button>Log</button><button>Numbers</button><button>Fronts</button></div>
    <div class="body" id="railBody"></div>
  </aside>
</section>

<section class="below fade" id="below"></section>

<script>
/* ---------------- data (real cards from the live desks, 15 Oct evening) ---------------- */
const NOW = new Date('2026-10-15T19:05:00Z');
const R = [
 {d:'y',at:'19:00',s:'Yemeni Army Media',h:'Yemeni military releases footage of operations against Houthi forces in southern Marib',t:'combat',pl:'Marib',ll:[15.47,45.32]},
 {d:'i',at:'18:52',s:'Al-Mihwar',h:'Iran fires missiles at non-compliant ships in Strait of Hormuz',t:'vessel',pl:'Strait of Hormuz',ll:[26.57,56.25],new:1},
 {d:'y',at:'18:24',s:'Shajab News',h:'Houthi forces kill commander of the Fifth Presidential Guard Brigade in Taiz',t:'combat',pl:'Taiz',ll:[13.58,44.02],new:1},
 {d:'i',at:'18:49',s:'US Treasury',h:'Operation Economic Outcast disrupts Iran’s financial infiltration through Iraqi bank supporting proxy militias',t:'statement'},
 {d:'y',at:'18:05',s:'2 December News',h:'Houthi forces fire 9 ballistic missiles and 7 projectiles at residential areas in Marib',t:'strike',pl:'Marib',ll:[15.5,45.36],new:1},
 {d:'i',at:'18:46',s:'Al Jazeera',h:'US crude oil tops $98 a barrel, up 3%, on fears of Hormuz supply disruption and falling inventories',t:'economy'},
 {d:'y',at:'18:50',s:'Asharq News',h:'Coalition spokesperson releases footage of strikes on Houthi missile depots',t:'strike'},
 {d:'i',at:'18:37',s:'Tasnim',h:'Senior Iranian diplomat: Iran seriously considering NPT withdrawal, insists Lebanon file in any future deal',t:'statement'},
 {d:'y',at:'18:46',s:'Al-Yemen Now',h:'Local sources: Tribal sheikh and his guard killed in Houthi attack in Sanaa',t:'combat',pl:'Sanaa',ll:[15.35,44.2]},
 {d:'i',at:'18:25',s:'Iran International',h:'Boats gather cargo from sunken GFS Pride off Oman after projectile strike',t:'strike',pl:'Gulf of Oman',ll:[24.9,57.6]},
 {d:'y',at:'18:44',s:'Crater Sky',h:'Yemeni government forces kill and wound Houthi fighters in Al-Aqroud ambush',t:'combat',pl:'Al-Aqroud',ll:[13.62,44.1]},
 {d:'i',at:'18:18',s:'Al-Manar',h:'Israeli artillery strikes between Zoutar and Mayfadoun in south Lebanon',t:'combat',pl:'Zawtar',ll:[33.32,35.46]},
 {d:'y',at:'19:00',s:'Al-Masirah',h:'Akasa Air extends suspension of flights to Riyadh until Oct 24',t:'economy',pl:'Riyadh',ll:[24.71,46.68]},
 {d:'i',at:'17:56',s:'Asharq Al-Awsat',h:'Araghchi tells Aoun Iran remains committed to MoU and ending wars on all fronts, blames US for failure to implement',t:'diplomacy'},
 {d:'y',at:'18:41',s:'Tehran Fori',h:'Iranian diplomat: mediation between Saudi Arabia and Yemen continues',t:'diplomacy'},
 {d:'i',at:'17:53',s:'Middle East Eye',h:'UN agency warns Hormuz shipping disruption starting to hit harvests',t:'statement'},
 {d:'i',at:'17:52',s:'NY Post',h:'Oil flow through Strait of Hormuz hits 12M barrels a day',t:'economy'},
];
R.sort((a,b)=>b.at.localeCompare(a.at));

const DESKS = {
  home:{name:'All desks', bounds:[[11,36],[39,62]], kicker:'Across the desks', },
  yemen:{name:'Yemen conflict', bounds:[[12.1,41.6],[19.3,53.6]], cap:'Sanaa', tz:3, color:'var(--houthi)',
    line:'Houthi ballistic missiles struck the Al-Maasheeq presidential compound in Aden, with Yemeni officials confirming Prime Minister Shaya al-Zindani and cabinet ministers were unharmed.',
    devs:['Houthi ballistic missiles struck the Al-Maasheeq presidential compound in Aden; officials say the prime minister and cabinet were unharmed.','Government forces push in southern Marib as Houthi forces fire nine ballistic missiles at residential areas in the city.','Indian carriers Akasa Air and IndiGo extend suspension of flights to Saudi Arabia until 24 October.'],
    res:[['Reports 24h','63','+9'],['Strikes 24h','21','+4'],['Day of war','95',''],['Ships hit','—','']],
    shares:[['Houthi forces','20%','var(--houthi)'],['Government','69%','var(--teal)'],['Contested','11%','var(--gold)']]},
  iran:{name:'Iran conflict', bounds:[[21.5,33.5],[39.8,63.2]], cap:'Tehran', tz:3.5, color:'var(--iran)',
    line:'US Treasury adds Atlas Persian Kish company on Kish island to sanctions list.',
    devs:['Iran fires missiles at ships it calls non-compliant in the Strait of Hormuz; an explosion is heard there minutes later.','Senior Iranian diplomat: Iran seriously considering NPT withdrawal and insists the Lebanon file be part of any deal.','US crude tops $98 a barrel on fears of Hormuz supply disruption.'],
    res:[['Reports 24h','118','+22'],['Attacks 24h','27','−3'],['Day of war','230',''],['Oil (WTI)','$98','+3%']],
    shares:null},
};
const TYPE_COL = {strike:'#e2694f',combat:'#e3b64d',vessel:'#5fa8dc',economy:'#3fb0b3',statement:'#a99d93',diplomacy:'#9b7fd1'};
const SIDE_COL = {iran:'#e2694f',israel:'#5fa8dc',us:'#5fa8dc',unclear:'#a99d93',gulf:'#9b7fd1',hezbollah:'#d9aa45',iraqi_militias:'#c9895a'};

/* sample Yemen activity around the real fronts (mock only) */
const YFRONTS = [[15.47,45.32,40],[13.58,44.02,34],[14.8,42.95,18],[13.7,44.73,16],[16.94,43.76,12],[15.35,44.2,10],[12.8,45.03,8],[14.55,46.83,6],[16.2,44.5,6]];
let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const yPins=[]; YFRONTS.forEach(([la,ln,n])=>{for(let i=0;i<n;i++)yPins.push([Math.floor(rnd()*7),la+(rnd()-.5)*.45,ln+(rnd()-.5)*.45, rnd()<.6?'houthi':'gov'])});
const iPins = GEO.iranPins.map(p=>{const [m,d]=p[0].split('-').map(Number);const day=Math.round((NOW-new Date(Date.UTC(2026,m-1,d)))/864e5)-5; /* pin file ends 10 Oct: shifted for the mock */return [day,p[2],p[3],p[1]]});

/* ---------------- map ---------------- */
const map = L.map('map',{zoomControl:false,attributionControl:true,zoomSnap:.25,worldCopyJump:false,preferCanvas:true,minZoom:3,maxZoom:14}).setView([25,47],4);
L.control.zoom({position:'bottomright'}).addTo(map);
/* the page scrolls past the map; the wheel zooms only after a click on the map */
map.scrollWheelZoom.disable();
map.on('click',()=>map.scrollWheelZoom.enable());
map.getContainer().addEventListener('mouseleave',()=>map.scrollWheelZoom.disable());
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'Esri, HERE, Garmin, © OpenStreetMap'}).addTo(map);
map.createPane('shade'); map.getPane('shade').style.zIndex=350;
map.createPane('fog'); map.getPane('fog').style.zIndex=360;

const yemenControl = n=>{n=n.toLowerCase();
  if(/sanʿaʾ|sa'dah|'amran|hajjah|hudaydah|dhamar|ibb|raymah|mahwit|bayda/.test(n))return 'var(--houthi)';
  if(/ma'rib|ta'izz|dali|jawf/.test(n))return 'var(--contested)'; return 'var(--teal)';};
const cssv=v=>v.startsWith('var(')?getComputedStyle(document.documentElement).getPropertyValue(v.slice(4,-1)).trim():v;

const countryLayer = L.geoJSON({type:'FeatureCollection',features:GEO.countries},{pane:'shade',style:f=>({color:'#4a433d',weight:.8,fillColor:SIDE_COL[f.properties.side]||'#776',fillOpacity:f.properties.side==='iran'?.10:.05})});
const yemenLayer = L.geoJSON({type:'FeatureCollection',features:GEO.yemen},{pane:'shade',style:f=>({color:'#4a433d',weight:.8,fillColor:cssv(yemenControl(f.properties.name)),fillOpacity:.07})});
countryLayer.addTo(map); yemenLayer.addTo(map);

/* theatre outlines + labels (strategic zoom) */
const theatreY = L.rectangle(DESKS.yemen.bounds,{color:'#c45c26',weight:1,dashArray:'4 4',fill:false,interactive:false});
const theatreI = L.rectangle(DESKS.iran.bounds,{color:'#e2694f',weight:1,dashArray:'4 4',fill:false,interactive:false});

/* desk plates (home view) */
function spark(seedN,col){let s='';let v=10;const pts=[];for(let i=0;i<30;i++){v=Math.max(2,Math.min(22,v+(Math.sin(i*seedN)*4)+((i*seedN*7)%5-2)));pts.push(`${i*6.5},${24-v}`)}return `<svg class="spark" width="196" height="26" viewBox="0 0 196 26"><polyline fill="none" stroke="${col}" stroke-width="1.4" points="${pts.join(' ')}"/></svg>`}
const plateY = L.marker([16.2,41.2],{icon:L.divIcon({className:'plain',iconSize:null,iconAnchor:[244,60],html:`<div class="plate" data-desk="yemen"><div class="t"><span class="flag ye"><i></i><i></i><i></i></span>Yemen<span class="trend up">▲ 18% this week</span></div><p>${DESKS.yemen.devs[1]}</p><span class="go">Open desk →</span>${spark(.7,'#c45c26')}</div>`})});
const plateI = L.marker([33.5,61.2],{icon:L.divIcon({className:'plain',iconSize:null,iconAnchor:[-14,60],html:`<div class="plate" data-desk="iran"><div class="t"><span class="flag ir"><i></i><i></i><i></i></span>Iran<span class="trend down">▼ 6% this week</span></div><p>${DESKS.iran.devs[0]}</p><span class="go">Open desk →</span>${spark(1.3,'#e2694f')}</div>`})});
document.addEventListener('click',e=>{const p=e.target.closest('.plate,.dcard[data-desk]');if(p)go(p.dataset.desk)});

/* pins */
const pinLayer = L.layerGroup().addTo(map);
const heatLayer = L.layerGroup();
const fogLayer = L.layerGroup();
let lens='pins', curDesk='home', maxDay=7;

function drawPins(){
  pinLayer.clearLayers(); heatLayer.clearLayers();
  const show = curDesk;
  const pts=[];
  if(show!=='yemen') iPins.forEach(p=>{if(p[0]>=maxDay && p[0]<maxDay+7)pts.push({ll:[p[1],p[2]],c:SIDE_COL[p[3]]||'#a99d93',age:p[0]-maxDay,desk:'i'})});
  if(show!=='iran') yPins.forEach(p=>{if(p[0]>=maxDay && p[0]<maxDay+7)pts.push({ll:[p[1],p[2]],c:p[3]==='houthi'?'#c45c26':'#3fb0b3',age:p[0]-maxDay,desk:'y'})});
  pts.forEach(p=>L.circleMarker(p.ll,{radius:curDesk==='home'?3:4,weight:0,fillColor:p.c,fillOpacity:.35+.55*(1-p.age/8),interactive:false}).addTo(pinLayer));
  // live cards on top, clickable
  R.filter(r=>r.ll && (show==='home'||r.d===show[0])).forEach(r=>{
    const m=L.circleMarker(r.ll,{radius:7,color:'#fff8f1',weight:1.5,fillColor:TYPE_COL[r.t],fillOpacity:1}).addTo(pinLayer);
    m.on('click',()=>select(r));
    if(r.new) L.circleMarker(r.ll,{radius:13,color:TYPE_COL[r.t],weight:1,fill:false,className:'ring',interactive:false}).addTo(pinLayer);
  });
  // heat: grid density
  const cell=curDesk==='home'?1:.5, g={};
  pts.forEach(p=>{const k=Math.floor(p.ll[0]/cell)+':'+Math.floor(p.ll[1]/cell);g[k]=(g[k]||0)+1});
  const mx=Math.max(1,...Object.values(g));
  Object.entries(g).forEach(([k,n])=>{const [a,b]=k.split(':').map(Number);const t=n/mx;
    L.rectangle([[a*cell,b*cell],[(a+1)*cell,(b+1)*cell]],{pane:'shade',weight:0,fillColor:t>.6?'#f4a58a':t>.3?'#e2694f':'#8a3b2b',fillOpacity:.25+.55*t,interactive:false}).addTo(heatLayer)});
  drawMini(pts);
}

/* quiet areas: governorates / countries with no reports in 7 days */
function drawFog(){
  fogLayer.clearLayers();
  const quiet=['Al Mahrah Governorate','Socotra','Hadhramaut','Shabwah Governorate'];
  GEO.yemen.filter(f=>quiet.includes(f.properties.name)).forEach(f=>{
    L.geoJSON(f,{pane:'fog',style:{weight:0,fillColor:'#000',fillOpacity:.55}}).addTo(fogLayer);
  });
  ['Turkey','Azerbaijan','Egypt','Cyprus','N. Cyprus'].forEach(n=>{const f=GEO.countries.find(c=>c.properties.name===n);if(f)L.geoJSON(f,{pane:'fog',style:{weight:0,fillColor:'#000',fillOpacity:.55}}).addTo(fogLayer)});
  L.marker([17.2,50.6],{icon:L.divIcon({className:'plain',html:'<span class="fogtxt">No confirmed reports · 7 days</span>'})}).addTo(fogLayer);
}

function setLens(l){
  lens=l; document.querySelectorAll('#lenses button').forEach(b=>b.classList.toggle('on',b.dataset.lens===l));
  [heatLayer,fogLayer].forEach(x=>map.removeLayer(x));
  pinLayer.addTo(map);
  countryLayer.setStyle(f=>({fillOpacity:l==='control'?(f.properties.side==='iran'?.35:.22):(f.properties.side==='iran'?.10:.05)}));
  yemenLayer.setStyle(()=>({fillOpacity:l==='control'?.42:.07,weight:l==='control'?1.2:.8}));
  if(l==='heat'){heatLayer.addTo(map);map.removeLayer(pinLayer)}
  if(l==='fog'){drawFog();fogLayer.addTo(map)}
}
document.getElementById('lenses').onclick=e=>{const b=e.target.closest('button');if(b)setLens(b.dataset.lens)};

/* selection card */
const selEl=document.getElementById('sel');
function select(r){
  if(r.ll) map.flyTo(r.ll,Math.max(map.getZoom(),r.d==='y'?8:7),{duration:1.1});
  const mix=r.s.match(/Masirah|Shajab|Tasnim|IRNA|Mihwar|Manar/)?[20,0,30,50]:[45,30,15,10];
  selEl.innerHTML=`<button class="x" onclick="this.parentNode.classList.remove('show')">✕</button>
   <div class="meta"><span class="ty">${r.t}</span>${r.at} · ${r.pl||'No place'} · <span style="color:var(--accent)">${r.s}</span></div>
   <h4>${r.h}</h4>
   <div class="mixl"><span>Who else reported it</span><span>${r.new?'3 outlets':'1 outlet'}</span></div>
   <div class="mix"><i style="width:${mix[0]}%;background:#3fb0b3"></i><i style="width:${mix[1]}%;background:#5fa8dc"></i><i style="width:${mix[2]}%;background:#e3b64d"></i><i style="width:${mix[3]}%;background:#c45c26"></i></div>
   <div class="mixl"><span>Official</span><span>Wire</span><span>Local</span><span>Party</span></div>
   <div class="acts"><button>Nearby, 7 days</button><button>Same actor</button><button>Read report</button><button>Share this view</button></div>`;
  selEl.classList.add('show');
}

/* last alert jump */
let alertIdx=0;
function jump(){const list=R.filter(r=>r.ll&&(curDesk==='home'||r.d===curDesk[0]));const r=list[alertIdx%list.length];alertIdx++;select(r);
  const c=document.getElementById('chips');c.innerHTML=`<span class="chip">${alertIdx}/${list.length} · ${r.pl}</span>`}
document.getElementById('jump').onclick=jump;

/* minimap */
function drawMini(pts){
  const c=document.getElementById('miniC'),x=c.getContext('2d');x.clearRect(0,0,340,240);
  const B=[[9,31],[40.5,64]], px=ll=>[(ll[1]-B[0][1])/(B[1][1]-B[0][1])*340,(B[1][0]-ll[0])/(B[1][0]-B[0][0])*240];
  x.strokeStyle='#4a433d';x.lineWidth=1;
  [...GEO.countries,...GEO.yemen].forEach(f=>f.geometry.coordinates.forEach(poly=>poly.forEach(ring=>{x.beginPath();ring.forEach((p,i)=>{const [a,b]=px([p[1],p[0]]);i?x.lineTo(a,b):x.moveTo(a,b)});x.stroke()})));
  pts.forEach(p=>{const [a,b]=px(p.ll);x.fillStyle=p.c;x.globalAlpha=.7;x.fillRect(a-1,b-1,2.4,2.4)});x.globalAlpha=1;
  const vb=map.getBounds();const [l,t]=px([vb.getNorth(),vb.getWest()]),[r,bm]=px([vb.getSouth(),vb.getEast()]);
  x.strokeStyle='#f4a58a';x.lineWidth=2;x.strokeRect(l,t,r-l,bm-t);
}
map.on('moveend',()=>drawMini(lastPts()));
function lastPts(){const a=[];pinLayer.eachLayer(m=>{if(m.getLatLng&&m.options.radius<5)a.push({ll:[m.getLatLng().lat,m.getLatLng().lng],c:m.options.fillColor})});return a}
document.getElementById('mini').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();const fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;map.flyTo([40.5-fy*31.5,31+fx*33],map.getZoom(),{duration:.6})};

/* scrubber */
const trackC=document.getElementById('trackC'),range=document.getElementById('range');
function drawTrack(){const w=trackC.clientWidth*2;trackC.width=w;const x=trackC.getContext('2d');const days=60,bars=new Array(days).fill(0);
  iPins.forEach(p=>{if(p[0]<days&&curDesk!=='yemen')bars[p[0]]++});
  yPins.forEach(p=>{if(curDesk!=='iran')bars[p[0]]+=3});
  const mx=Math.max(...bars);bars.forEach((v,i)=>{const bx=w-(i+1)*w/days;const h=v/mx*44;x.fillStyle=i<7?'#e2694f':'#4a433d';x.fillRect(bx+1,52-h,w/days-2,h)});
  x.fillStyle='#766b62';x.font='18px JetBrains Mono';x.fillText('60 days ago',4,18);}
function setDay(){const v=+range.value;maxDay=Math.round((100-v)/100*53);
  const t=document.getElementById('thumb');t.style.left=`calc(${v}% - 1px)`;
  const d=new Date(NOW-maxDay*864e5);const lbl=maxDay===0?'Today':d.toUTCString().slice(5,11);
  document.getElementById('thumbLbl').textContent=lbl;document.getElementById('when').textContent=maxDay===0?'Last 7 days':'7 days to '+lbl;drawPins()}
range.oninput=setDay;
let playing=null;
document.getElementById('play').onclick=function(){if(playing){clearInterval(playing);playing=null;this.textContent='▶';return}
  range.value=0;this.textContent='❚❚';playing=setInterval(()=>{range.value=Math.min(100,+range.value+1.9);setDay();if(+range.value>=100){clearInterval(playing);playing=null;document.getElementById('play').textContent='▶'}},120)};

/* ---------------- views ---------------- */
const headrow=document.getElementById('headrow'), below=document.getElementById('below');
function cardHTML(r){const dk=r.d==='y'?'Yemen':'Iran';const col=r.d==='y'?'#c45c26':'#e2694f';
  return `<div class="card ${r.new?'new':''}" data-i="${R.indexOf(r)}"><span class="edge" style="background:${TYPE_COL[r.t]}"></span><div>
  <div class="m">${curDesk==='home'?`<span class="dk" style="color:${col};border-color:${col}">${dk}</span>`:''}<span>${r.at}</span><span class="src">${r.s}</span></div>
  <h3>${r.h}</h3>${r.ll?`<div class="pin">◉ ${r.pl} · show on map</div>`:''}</div></div>`}
function render(){
  const D=DESKS[curDesk];
  if(curDesk==='home'){
    headrow.innerHTML=`<div><div class="kicker"><b>●</b> Live · two desks · updated 22:00 Tehran</div>
      <div class="deskh">The region tonight</div>
      <p class="oneline">Iran fires missiles at ships in the Strait of Hormuz<sup>1</sup>, while in Yemen government forces push in southern Marib under Houthi missile fire<sup>2</sup>.</p></div>`;
    below.innerHTML=`<div class="col"><div class="sech"><h2>Latest reports</h2><div class="filters" id="flt"><button class="on" data-f="all">All desks</button><button data-f="y">Yemen</button><button data-f="i">Iran</button></div></div><div id="feed"></div></div>
      <div class="col"><div class="sech"><h2>The desks</h2></div><div class="deskrow">
        <div class="dcard" data-desk="yemen"><div class="t"><span class="flag ye"><i></i><i></i><i></i></span>Yemen conflict<span class="trend up" style="margin-left:auto">▲</span></div><p>${DESKS.yemen.line}</p></div>
        <div class="dcard" data-desk="iran"><div class="t"><span class="flag ir"><i></i><i></i><i></i></span>Iran conflict<span class="trend down" style="margin-left:auto">▼</span></div><p>${DESKS.iran.line}</p></div>
        <div class="dcard ghost"><div class="t">More desks coming</div><p>Each desk has its own map, reports and method; all share one look.</p></div></div>
        <div class="sech" style="margin-top:18px"><h2>How we work</h2></div>
        <p class="about">Every report is traced to its first source and written as plain wire copy. Pins mark single events; control changes only on several independent reports. <a href="#" style="color:var(--accent)">Methodology →</a></p></div>`;
    feed('all');
    document.getElementById('flt').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#flt button').forEach(x=>x.classList.toggle('on',x===b));feed(b.dataset.f)};
  } else {
    headrow.innerHTML=`<div><div class="kicker">Desk · <b>●</b> live · ${D.cap} <span id="capclock"></span></div>
      <div class="deskh">${D.name}<span class="sw">▾</span></div>
      <p class="oneline">${D.line}<sup>1</sup></p></div>
      ${D.shares?`<div class="shares">${D.shares.map(s=>`<div class="share" style="border-top:2px solid ${s[2]}"><small>${s[0]}</small><b>${s[1]}</b></div>`).join('')}</div>`:''}`;
    below.innerHTML=`<div class="col devs"><div class="sech"><h2>Latest developments</h2><span class="kicker">Based on latest reports · 22:00</span></div>
       <ol>${D.devs.map((d,i)=>`<li>${d}<sup>${i+1}</sup></li>`).join('')}</ol>
       <div class="nums">${D.res.map(r=>`<div class="num"><small>${r[0]}</small><b>${r[1]}</b>${spark(r[0].length/7,'#a99d93').replace('width="196"','width="100%"')}</div>`).join('')}</div></div>
       <div class="col"><div class="sech"><h2>Latest reports</h2></div><div id="feed"></div></div>`;
    feed(curDesk[0]);
  }
  document.getElementById('res').innerHTML=(curDesk==='home'?[['Reports 24h','181','+31'],['Attacks 24h','48','+1'],['Desks live','2','']]:D.res).map(r=>`<div><small>${r[0]}</small><b>${r[1]}</b>${r[2]?`<i>${r[2]}</i>`:''}</div>`).join('');
  railRender();
}
function feed(f){const el=document.getElementById('feed');el.innerHTML=R.filter(r=>f==='all'||r.d===f).slice(0,curDesk==='home'?12:10).map(cardHTML).join('');}
document.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)select(R[c.dataset.i])});
function railRender(){const list=R.filter(r=>curDesk==='home'||r.d===curDesk[0]);
  document.getElementById('railBody').innerHTML=list.map(cardHTML).join('')+`<div class="log" style="margin-top:12px">${list.map(r=>`<div><span>${r.at}</span> ${r.t.toUpperCase().padEnd(9,' ')} ${r.h.slice(0,60)}…</div>`).join('')}</div>`}

let first=true;
const pad=()=>document.body.classList.contains('cmd')&&innerWidth>820?{paddingTopLeft:[10,10],paddingBottomRight:[370,10]}:{padding:[10,10]};
function go(desk){
  if(desk===curDesk)return;
  curDesk=desk;
  document.body.classList.toggle('home',desk==='home');
  document.querySelectorAll('.deskbtn').forEach(b=>b.classList.toggle('on',b.dataset.desk===desk));
  [headrow,below].forEach(x=>x.classList.add('out'));
  selEl.classList.remove('show');
  setTimeout(()=>{render();[headrow,below].forEach(x=>x.classList.remove('out'))},250);
  if(first){first=false;map.fitBounds(DESKS[desk].bounds,{animate:false,...pad()})} else map.flyToBounds(DESKS[desk].bounds,{duration:1.6,easeLinearity:.2,...pad()});
  if(desk==='home'){plateY.addTo(map);plateI.addTo(map);theatreY.addTo(map);theatreI.addTo(map)}else{[plateY,plateI,theatreY,theatreI].forEach(l=>map.removeLayer(l))}
  countryLayer.setStyle(f=>({opacity:desk==='yemen'&&f.properties.name!=='Saudi Arabia'?.4:1}));
  drawPins(); drawTrack();
  history.replaceState(null,'','#'+desk);
}
document.getElementById('strip').onclick=e=>{const b=e.target.closest('.deskbtn');if(b&&!b.disabled)go(b.dataset.desk)};
document.getElementById('homeLink').onclick=()=>go('home');

document.getElementById('layoutSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#layoutSeg button').forEach(x=>x.classList.toggle('on',x===b));document.body.classList.toggle('cmd',b.dataset.l==='cmd');setTimeout(()=>{map.invalidateSize();map.fitBounds(DESKS[curDesk].bounds,pad());drawTrack()},50)};

document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key===' '){e.preventDefault();jump()}
  ({'0':()=>go('home'),'1':()=>go('yemen'),'2':()=>go('iran'),q:()=>setLens('pins'),w:()=>setLens('heat'),e:()=>setLens('control'),r:()=>setLens('fog')})[e.key.toLowerCase()]?.()});

/* clock */
function tick(){const t=new Date();const f=(o)=>new Date(t.getTime()+o*36e5).toISOString().slice(11,19);
  document.getElementById('clock').innerHTML=`Sanaa <b>${f(3)}</b> &nbsp; Tehran <b>${f(3.5)}</b>`;}
setInterval(tick,1000);tick();

/* new-report chips arriving (Frostpunk-style edge stack) */
setTimeout(()=>{document.getElementById('chips').innerHTML='<span class="chip">+2 new · Hormuz</span><span class="chip">+1 new · Taiz</span>'},2500);

/* start */
const start=(location.hash||'#home').slice(1);
curDesk='__';go(DESKS[start]?start:'home');
setTimeout(()=>{drawTrack();setDay()},300);
</script>
</body>
</html>
