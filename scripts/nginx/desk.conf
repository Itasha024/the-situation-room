# The site's front door (22 Oct): cloudflared -> here -> the live desk-web@ port.
# A deploy starts the new release on the other port, warms it, then points
# desk-upstream.conf at it and reloads, so visitors never meet a restart.
#
# Speed (user, 26 Oct: "make sure everything loads as quick as possible and that it'll stay like this"):
# the small server's CPU runs out when the scans are busy, and a page or even a script then waited up
# to 100 s on the app. So nginx serves the release's files itself, and keeps every page and read of the
# desks for a few seconds: a visitor gets the last copy at once while one request refreshes it behind.
# Installed by scripts/nginx/install.sh; this file is the copy of record.

proxy_cache_path /var/cache/nginx/desk levels=1:2 keys_zone=desk:20m max_size=300m inactive=2d use_temp_path=off;

upstream desk { include /etc/nginx/desk-upstream.conf; keepalive 8; }

# Actions and live streams are never kept.
map $uri $desk_nocache {
  default 0;
  ~^/api/(?:tick|scan|status|tgmedia) 1;
  ~^/__grok/ 1;
}

server {
  listen 127.0.0.1:3000;
  access_log off;
  client_max_body_size 5m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json application/geo+json application/manifest+json text/plain image/svg+xml application/xml text/xml;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;

  # The build's hashed files never change.
  location ^~ /assets/ {
    root /srv/desk/current/public;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri @app;
  }
  location ^~ /__grok/ {
    proxy_pass http://desk;
  }
  # The release's other files (app.js, the maps' shapes, the styles) straight from disk.
  location ~* \.(?:js|mjs|css|json|geojson|svg|png|jpe?g|webp|gif|ico|woff2?|txt|xml|webmanifest|html)$ {
    root /srv/desk/current/public;
    add_header Cache-Control "public, max-age=120, stale-while-revalidate=86400";
    try_files $uri @app;
  }

  location / {
    try_files /nonexistent @app;
  }

  location @app {
    proxy_pass http://desk;
    proxy_buffering on;
    proxy_cache desk;
    proxy_cache_key "$host$request_uri";
    proxy_cache_bypass $desk_nocache;
    proxy_no_cache $desk_nocache;
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_valid 200 301 302 15s;
    proxy_cache_valid 404 5s;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    add_header X-Desk-Cache $upstream_cache_status always;
  }
}
